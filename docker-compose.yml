version: '3.8'

services:
  js-miner-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=JS Miner API
      - APP_VERSION=2.0.0
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - VERBOSE_LOGGING=True
      - MAX_WORKERS=10
      - SHANNON_ENTROPY_THRESHOLD=3.5
      - NPM_REGISTRY_URL=https://registry.npmjs.org
      - NPM_JS_URL=https://www.npmjs.com
    volumes:
      - ./app:/app/app
    restart: unless-stopped
